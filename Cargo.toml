[package]
name = "abyss"
version = "0.4.0"
edition = "2024"
description = "Gamified deep-sea screensaver for Omarchy: pixel-art ocean, XP, trophies, bestiary"
license = "MIT"
repository = "https://github.com/cesarfilho/omarchy-abyss"
readme = "README.md"
keywords = ["screensaver", "terminal", "omarchy", "pixel-art"]
categories = ["command-line-utilities"]

[dependencies]
crossterm = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
signal-hook = "0.4.5"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
